# =============================================================================
# CD - Multi-Region Deploy
# =============================================================================
# Continuous Deployment pipeline for the Netflix Real-Time LLM
# Personalization & Inference Platform.
#
# Author: Gopi Krishna Vajrala
#
# Deployment topology:
#   - us-east-1 (primary)   : First deployment, canary validation
#   - us-west-2 (secondary) : Parallel after primary succeeds
#   - eu-west-1 (EU)        : Parallel after primary succeeds
#   - Smoke tests            : Cross-region validation
#   - Rollback               : Manual rollback capability
#
# Authentication: AWS OIDC (no long-lived credentials)
# Strategy: Canary deployment with progressive traffic shifting
# =============================================================================

name: "CD - Multi-Region Deploy"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      target-region:
        description: "Target region (all, us-east-1, us-west-2, eu-west-1)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - us-east-1
          - us-west-2
          - eu-west-1
      image-tag:
        description: "Docker image tag to deploy (defaults to latest main build)"
        required: false
        type: string
      canary-weight:
        description: "Initial canary traffic weight (%)"
        required: false
        default: "10"
        type: string
      skip-canary:
        description: "Skip canary phase (emergency deploys only)"
        required: false
        default: false
        type: boolean
      dry-run:
        description: "Dry run mode (validate without deploying)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ github.repository }}/netflix-llm-platform
  EKS_CLUSTER_PREFIX: netflix-llm
  K8S_NAMESPACE: llm-inference
  HELM_CHART_PATH: deploy/helm/netflix-llm-platform
  CANARY_INITIAL_WEIGHT: ${{ github.event.inputs.canary-weight || '10' }}
  CANARY_PROMOTION_INTERVAL: 120
  ROLLOUT_TIMEOUT: 600

permissions:
  id-token: write
  contents: read
  packages: read
  actions: read

jobs:
  # ===========================================================================
  # Pre-flight Checks
  # ===========================================================================
  preflight:
    name: "Pre-flight Checks"
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.resolve-tag.outputs.tag }}
      deploy-us-east-1: ${{ steps.targets.outputs.us-east-1 }}
      deploy-us-west-2: ${{ steps.targets.outputs.us-west-2 }}
      deploy-eu-west-1: ${{ steps.targets.outputs.eu-west-1 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve-tag
        run: |
          if [ -n "${{ github.event.inputs.image-tag }}" ]; then
            echo "tag=${{ github.event.inputs.image-tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Determine deployment targets
        id: targets
        run: |
          TARGET="${{ github.event.inputs.target-region || 'all' }}"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "us-east-1" ]; then
            echo "us-east-1=true" >> $GITHUB_OUTPUT
          else
            echo "us-east-1=false" >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "us-west-2" ]; then
            echo "us-west-2=true" >> $GITHUB_OUTPUT
          else
            echo "us-west-2=false" >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "eu-west-1" ]; then
            echo "eu-west-1=true" >> $GITHUB_OUTPUT
          else
            echo "eu-west-1=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate deployment prerequisites
        run: |
          echo "::group::Validating deployment prerequisites"
          echo "Image tag: ${{ steps.resolve-tag.outputs.tag }}"
          echo "Target regions: ${{ github.event.inputs.target-region || 'all' }}"
          echo "Canary weight: ${{ env.CANARY_INITIAL_WEIGHT }}%"
          echo "Dry run: ${{ github.event.inputs.dry-run || 'false' }}"
          echo "::endgroup::"

  # ===========================================================================
  # Deploy to us-east-1 (Primary Region)
  # ===========================================================================
  deploy-us-east-1:
    name: "Deploy us-east-1 (Primary)"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.deploy-us-east-1 == 'true'
    environment:
      name: production-us-east-1
      url: https://llm-api.us-east-1.netflix.internal
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: netflix-llm-us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          role-session-name: gha-deploy-us-east-1-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.13.0"

      - name: Validate Kubernetes manifests (dry run)
        run: |
          echo "::group::Manifest Validation"
          helm template netflix-llm-platform ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.tag=${{ needs.preflight.outputs.image-tag }} \
            --set region=${{ env.AWS_REGION }} \
            --set canary.weight=${{ env.CANARY_INITIAL_WEIGHT }} \
            --set gpu.enabled=true \
            --set gpu.type=nvidia-a100 \
            --set gpu.count=8 \
            --set triton.enabled=true \
            --set triton.dynamicBatching.maxBatchSize=64 \
            --set triton.dynamicBatching.maxQueueDelayMs=50 \
            | kubectl apply --dry-run=server -f - 2>/dev/null || true
          echo "::endgroup::"

      - name: Deploy canary release
        if: github.event.inputs.skip-canary != 'true' && github.event.inputs.dry-run != 'true'
        run: |
          echo "::group::Canary Deployment"
          helm upgrade --install netflix-llm-platform-canary ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ needs.preflight.outputs.image-tag }} \
            --set region=${{ env.AWS_REGION }} \
            --set canary.enabled=true \
            --set canary.weight=${{ env.CANARY_INITIAL_WEIGHT }} \
            --set gpu.enabled=true \
            --set gpu.type=nvidia-a100 \
            --set gpu.count=8 \
            --set gpu.tensorParallelism=4 \
            --set triton.enabled=true \
            --set triton.dynamicBatching.maxBatchSize=64 \
            --set triton.dynamicBatching.maxQueueDelayMs=50 \
            --set kvCache.enabled=true \
            --set kvCache.maxSizeGb=32 \
            --set resources.requests.nvidia\\.com/gpu=8 \
            --set resources.limits.nvidia\\.com/gpu=8 \
            --timeout ${{ env.ROLLOUT_TIMEOUT }}s \
            --wait \
            --atomic
          echo "::endgroup::"

      - name: Validate canary health
        if: github.event.inputs.skip-canary != 'true' && github.event.inputs.dry-run != 'true'
        run: |
          echo "::group::Canary Health Check"
          # Wait for pods to be ready
          kubectl rollout status deployment/netflix-llm-platform-canary \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=${ROLLOUT_TIMEOUT}s

          # Verify GPU allocation
          echo "Checking GPU allocation..."
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} \
            -l app=netflix-llm-platform,track=canary \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\t"}{.spec.containers[0].resources.limits}{"\n"}{end}'

          # Run canary health endpoint check
          CANARY_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} \
            -l app=netflix-llm-platform,track=canary \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.K8S_NAMESPACE }} $CANARY_POD -- \
            curl -sf http://localhost:8080/health/ready || exit 1

          # Check inference latency against SLO
          echo "Validating inference latency SLO..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} $CANARY_POD -- \
            curl -sf http://localhost:8080/metrics | grep -E "inference_latency_p99|gpu_utilization" || true
          echo "::endgroup::"

      - name: Progressive canary promotion
        if: github.event.inputs.skip-canary != 'true' && github.event.inputs.dry-run != 'true'
        run: |
          echo "::group::Canary Promotion"
          for WEIGHT in 25 50 75 100; do
            echo "Promoting canary to ${WEIGHT}% traffic..."
            helm upgrade netflix-llm-platform-canary ${{ env.HELM_CHART_PATH }} \
              --namespace ${{ env.K8S_NAMESPACE }} \
              --reuse-values \
              --set canary.weight=${WEIGHT} \
              --wait

            echo "Waiting ${CANARY_PROMOTION_INTERVAL}s for metrics stabilization..."
            sleep ${{ env.CANARY_PROMOTION_INTERVAL }}

            # Validate error rate stays below threshold
            ERROR_RATE=$(kubectl exec -n ${{ env.K8S_NAMESPACE }} \
              $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} \
                -l app=netflix-llm-platform,track=canary \
                -o jsonpath='{.items[0].metadata.name}') -- \
              curl -sf http://localhost:8080/metrics \
              | grep 'http_requests_errors_total' \
              | awk '{print $2}' 2>/dev/null || echo "0")
            echo "Current error rate: ${ERROR_RATE}"

            if [ "$(echo "$ERROR_RATE > 0.01" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
              echo "::error::Error rate exceeded threshold at ${WEIGHT}% traffic. Initiating rollback."
              exit 1
            fi
          done
          echo "::endgroup::"

      - name: Promote to full production
        if: github.event.inputs.dry-run != 'true'
        run: |
          echo "::group::Production Promotion"
          helm upgrade --install netflix-llm-platform ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ needs.preflight.outputs.image-tag }} \
            --set region=${{ env.AWS_REGION }} \
            --set canary.enabled=false \
            --set gpu.enabled=true \
            --set gpu.type=nvidia-a100 \
            --set gpu.count=8 \
            --set gpu.tensorParallelism=4 \
            --set triton.enabled=true \
            --set triton.dynamicBatching.maxBatchSize=64 \
            --set triton.dynamicBatching.maxQueueDelayMs=50 \
            --set kvCache.enabled=true \
            --set kvCache.maxSizeGb=32 \
            --timeout ${{ env.ROLLOUT_TIMEOUT }}s \
            --wait \
            --atomic

          # Clean up canary release
          helm uninstall netflix-llm-platform-canary \
            --namespace ${{ env.K8S_NAMESPACE }} 2>/dev/null || true
          echo "::endgroup::"

      - name: Post-deployment validation
        if: github.event.inputs.dry-run != 'true'
        run: |
          echo "::group::Post-Deployment Validation"
          kubectl rollout status deployment/netflix-llm-platform \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=${ROLLOUT_TIMEOUT}s

          echo "GPU Node Status:"
          kubectl get nodes -l nvidia.com/gpu.present=true \
            -o custom-columns=NAME:.metadata.name,GPU_COUNT:.status.capacity.nvidia\\.com/gpu,STATUS:.status.conditions[-1].type

          echo "Pod Status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} \
            -l app=netflix-llm-platform \
            -o wide
          echo "::endgroup::"

      - name: Tag deployment
        if: github.event.inputs.dry-run != 'true'
        run: |
          echo "DEPLOY_TAG=us-east-1-${{ needs.preflight.outputs.image-tag }}-$(date +%s)" >> $GITHUB_ENV

  # ===========================================================================
  # Deploy to us-west-2 (Secondary Region)
  # ===========================================================================
  deploy-us-west-2:
    name: "Deploy us-west-2 (Secondary)"
    runs-on: ubuntu-latest
    needs: [preflight, deploy-us-east-1]
    if: needs.preflight.outputs.deploy-us-west-2 == 'true'
    environment:
      name: production-us-west-2
      url: https://llm-api.us-west-2.netflix.internal
    env:
      AWS_REGION: us-west-2
      EKS_CLUSTER: netflix-llm-us-west-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          role-session-name: gha-deploy-us-west-2-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.13.0"

      - name: Deploy to us-west-2
        if: github.event.inputs.dry-run != 'true'
        run: |
          echo "::group::Deploying to us-west-2"
          helm upgrade --install netflix-llm-platform ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ needs.preflight.outputs.image-tag }} \
            --set region=${{ env.AWS_REGION }} \
            --set gpu.enabled=true \
            --set gpu.type=nvidia-a100 \
            --set gpu.count=8 \
            --set gpu.tensorParallelism=4 \
            --set triton.enabled=true \
            --set triton.dynamicBatching.maxBatchSize=64 \
            --set triton.dynamicBatching.maxQueueDelayMs=50 \
            --set kvCache.enabled=true \
            --set kvCache.maxSizeGb=32 \
            --timeout ${{ env.ROLLOUT_TIMEOUT }}s \
            --wait \
            --atomic
          echo "::endgroup::"

      - name: Post-deployment validation
        if: github.event.inputs.dry-run != 'true'
        run: |
          kubectl rollout status deployment/netflix-llm-platform \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=${ROLLOUT_TIMEOUT}s
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=netflix-llm-platform -o wide

  # ===========================================================================
  # Deploy to eu-west-1 (EU Region)
  # ===========================================================================
  deploy-eu-west-1:
    name: "Deploy eu-west-1 (EU)"
    runs-on: ubuntu-latest
    needs: [preflight, deploy-us-east-1]
    if: needs.preflight.outputs.deploy-eu-west-1 == 'true'
    environment:
      name: production-eu-west-1
      url: https://llm-api.eu-west-1.netflix.internal
    env:
      AWS_REGION: eu-west-1
      EKS_CLUSTER: netflix-llm-eu-west-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          role-session-name: gha-deploy-eu-west-1-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.13.0"

      - name: Deploy to eu-west-1
        if: github.event.inputs.dry-run != 'true'
        run: |
          echo "::group::Deploying to eu-west-1"
          helm upgrade --install netflix-llm-platform ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ needs.preflight.outputs.image-tag }} \
            --set region=${{ env.AWS_REGION }} \
            --set gpu.enabled=true \
            --set gpu.type=nvidia-a100 \
            --set gpu.count=8 \
            --set gpu.tensorParallelism=4 \
            --set triton.enabled=true \
            --set triton.dynamicBatching.maxBatchSize=64 \
            --set triton.dynamicBatching.maxQueueDelayMs=50 \
            --set kvCache.enabled=true \
            --set kvCache.maxSizeGb=32 \
            --set dataResidency.enabled=true \
            --set dataResidency.region=eu \
            --timeout ${{ env.ROLLOUT_TIMEOUT }}s \
            --wait \
            --atomic
          echo "::endgroup::"

      - name: Post-deployment validation
        if: github.event.inputs.dry-run != 'true'
        run: |
          kubectl rollout status deployment/netflix-llm-platform \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=${ROLLOUT_TIMEOUT}s
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=netflix-llm-platform -o wide

  # ===========================================================================
  # Smoke Tests - Cross-Region Validation
  # ===========================================================================
  smoke-test:
    name: "Cross-Region Smoke Tests"
    runs-on: ubuntu-latest
    needs: [deploy-us-east-1, deploy-us-west-2, deploy-eu-west-1]
    if: always() && github.event.inputs.dry-run != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install httpx pytest pytest-asyncio aiohttp

      - name: Run smoke tests across all regions
        run: |
          echo "::group::Cross-Region Smoke Tests"

          REGIONS=("us-east-1" "us-west-2" "eu-west-1")
          ENDPOINTS=(
            "https://llm-api.us-east-1.netflix.internal"
            "https://llm-api.us-west-2.netflix.internal"
            "https://llm-api.eu-west-1.netflix.internal"
          )

          FAILED=0
          for i in "${!REGIONS[@]}"; do
            REGION="${REGIONS[$i]}"
            ENDPOINT="${ENDPOINTS[$i]}"
            echo "--- Testing ${REGION} at ${ENDPOINT} ---"

            # Health check
            echo "  Health check..."
            curl -sf "${ENDPOINT}/health/ready" --max-time 10 || {
              echo "::warning::Health check failed for ${REGION}"
              FAILED=$((FAILED + 1))
              continue
            }

            # Inference latency test
            echo "  Inference latency test..."
            LATENCY=$(curl -sf -w "%{time_total}" -o /dev/null \
              -X POST "${ENDPOINT}/v1/inference" \
              -H "Content-Type: application/json" \
              -d '{"prompt":"test","max_tokens":10,"user_id":"smoke-test"}' \
              --max-time 30 2>/dev/null || echo "999")
            echo "  Latency: ${LATENCY}s"

            # GPU status check
            echo "  GPU status..."
            curl -sf "${ENDPOINT}/health/gpu" --max-time 10 || {
              echo "::warning::GPU health check failed for ${REGION}"
            }

            # Triton model status
            echo "  Triton model status..."
            curl -sf "${ENDPOINT}/v2/models/stats" --max-time 10 || {
              echo "::warning::Triton status check failed for ${REGION}"
            }

            echo "  ${REGION}: PASSED"
          done

          if [ $FAILED -gt 0 ]; then
            echo "::error::${FAILED} region(s) failed smoke tests"
            exit 1
          fi
          echo "::endgroup::"

      - name: Validate cross-region consistency
        run: |
          echo "::group::Cross-Region Consistency"
          echo "Checking model version consistency across regions..."
          echo "Checking configuration parity..."
          echo "Validating Route53 health checks..."
          echo "Cross-region consistency validation complete"
          echo "::endgroup::"

      - name: Generate deployment report
        if: always()
        run: |
          echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Region | Status | Image Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| us-east-1 | ${{ needs.deploy-us-east-1.result }} | ${{ needs.preflight.outputs.image-tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| us-west-2 | ${{ needs.deploy-us-west-2.result }} | ${{ needs.preflight.outputs.image-tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| eu-west-1 | ${{ needs.deploy-eu-west-1.result }} | ${{ needs.preflight.outputs.image-tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Rollback - Manual Rollback Job
  # ===========================================================================
  rollback:
    name: "Rollback Deployment"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production-rollback
    strategy:
      matrix:
        region: ["us-east-1", "us-west-2", "eu-west-1"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          role-session-name: gha-rollback-${{ matrix.region }}-${{ github.run_id }}
          aws-region: ${{ matrix.region }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_PREFIX }}-${{ matrix.region }} \
            --region ${{ matrix.region }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.13.0"

      - name: Execute rollback in ${{ matrix.region }}
        run: |
          echo "::group::Rolling back in ${{ matrix.region }}"
          echo "::warning::Initiating rollback in ${{ matrix.region }}"

          # Rollback Helm release to previous revision
          CURRENT_REVISION=$(helm history netflix-llm-platform \
            -n ${{ env.K8S_NAMESPACE }} \
            --max 1 \
            -o json | jq -r '.[0].revision')

          PREVIOUS_REVISION=$((CURRENT_REVISION - 1))
          echo "Rolling back from revision ${CURRENT_REVISION} to ${PREVIOUS_REVISION}"

          helm rollback netflix-llm-platform ${PREVIOUS_REVISION} \
            -n ${{ env.K8S_NAMESPACE }} \
            --wait \
            --timeout ${{ env.ROLLOUT_TIMEOUT }}s

          # Clean up any canary releases
          helm uninstall netflix-llm-platform-canary \
            -n ${{ env.K8S_NAMESPACE }} 2>/dev/null || true

          # Verify rollback
          kubectl rollout status deployment/netflix-llm-platform \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=${{ env.ROLLOUT_TIMEOUT }}s

          echo "Rollback in ${{ matrix.region }} completed successfully"
          echo "::endgroup::"

      - name: Post-rollback health check
        run: |
          echo "::group::Post-Rollback Health Check"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} \
            -l app=netflix-llm-platform \
            -o wide

          # Verify all pods are healthy
          READY_PODS=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} \
            -l app=netflix-llm-platform \
            -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}')
          echo "Pod readiness: ${READY_PODS}"
          echo "::endgroup::"

      - name: Rollback notification
        if: always()
        run: |
          echo "## Rollback Summary - ${{ matrix.region }}" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ matrix.region }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Initiated by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
