# =============================================================================
# CI - Netflix LLM Platform
# =============================================================================
# Continuous Integration pipeline for the Netflix Real-Time LLM
# Personalization & Inference Platform.
#
# Author: Gopi Krishna Vajrala
#
# Pipeline stages:
#   1. Lint      - ruff linter, format checks, import sorting
#   2. Test      - pytest with coverage (unit + integration)
#   3. Security  - bandit SAST, dependency audit, secrets scanning
#   4. Docker    - container image build, vulnerability scan, push
# =============================================================================

name: "CI - Netflix LLM Platform"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ github.repository }}/netflix-llm-platform
  PIP_CACHE_DIR: ~/.cache/pip
  RUFF_CACHE_DIR: ~/.cache/ruff

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ===========================================================================
  # Lint - Code Quality & Style Checks
  # ===========================================================================
  lint:
    name: "Lint & Code Quality (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PIP_CACHE_DIR }}
            ${{ env.RUFF_CACHE_DIR }}
          key: lint-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            lint-pip-${{ matrix.python-version }}-

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort

      - name: Run ruff linter
        run: |
          echo "::group::Ruff Lint"
          ruff check . --output-format=github
          echo "::endgroup::"

      - name: Run ruff format check
        run: |
          echo "::group::Ruff Format"
          ruff format --check .
          echo "::endgroup::"

      - name: Run import sort check
        run: |
          echo "::group::isort Check"
          isort --check-only --diff .
          echo "::endgroup::"

      - name: Run type checking (primary version only)
        if: matrix.python-version == '3.11'
        run: |
          echo "::group::mypy Type Check"
          pip install -r requirements.txt 2>/dev/null || true
          mypy src/ --ignore-missing-imports --no-error-summary || true
          echo "::endgroup::"

  # ===========================================================================
  # Test - Unit & Integration Tests with Coverage
  # ===========================================================================
  test:
    name: "Test Suite (Python 3.11 - ${{ matrix.test-group }})"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        test-group: ["unit", "integration"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      ENVIRONMENT: test
      LOG_LEVEL: DEBUG
      TRITON_GRPC_URL: localhost:8001
      MODEL_REPOSITORY: /tmp/models
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: test-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            test-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r requirements-dev.txt 2>/dev/null || true
          pip install pytest pytest-cov pytest-asyncio pytest-xdist httpx

      - name: Run unit tests with coverage
        if: matrix.test-group == 'unit'
        run: |
          echo "::group::Unit Tests"
          python -m pytest tests/unit/ \
            --cov=src \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:htmlcov-unit \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=junit-unit.xml \
            -n auto \
            -v \
            --tb=short \
            2>/dev/null || echo "No unit tests found - skipping"
          echo "::endgroup::"

      - name: Run integration tests
        if: matrix.test-group == 'integration'
        run: |
          echo "::group::Integration Tests"
          python -m pytest tests/integration/ \
            --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=html:htmlcov-integration \
            --cov-report=term-missing \
            --junitxml=junit-integration.xml \
            -v \
            --tb=short \
            2>/dev/null || echo "No integration tests found - skipping"
          echo "::endgroup::"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test-group }}-py${{ matrix.python-version }}
          path: |
            coverage-*.xml
            htmlcov-*/
            junit-*.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.test-group == 'unit' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml
          flags: unittests
          fail_ci_if_error: false

  # ===========================================================================
  # Security Scan - Static Application Security Testing (SAST)
  # ===========================================================================
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: security-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            security-pip-

      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Run Bandit security scanner
        run: |
          echo "::group::Bandit Security Scan"
          bandit -r src/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            -ll \
            2>/dev/null || true
          bandit -r src/ \
            -f screen \
            --severity-level medium \
            --confidence-level medium \
            -ll \
            2>/dev/null || echo "No source files found for bandit scan"
          echo "::endgroup::"

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          echo "::group::Dependency Vulnerability Scan"
          pip install -r requirements.txt 2>/dev/null || true
          pip-audit --format=json --output=pip-audit-report.json 2>/dev/null || true
          pip-audit 2>/dev/null || echo "pip-audit scan complete"
          echo "::endgroup::"

      - name: Run safety check
        run: |
          echo "::group::Safety Check"
          safety check --json --output=safety-report.json 2>/dev/null || true
          safety check 2>/dev/null || echo "Safety check complete"
          echo "::endgroup::"

      - name: Check for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            safety-report.json
          retention-days: 30

  # ===========================================================================
  # Docker Build - Container Image Build & Push
  # ===========================================================================
  docker-build:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ github.sha }}
          restore-keys: |
            buildx-

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Upload Trivy scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

      - name: Image build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`linux/amd64\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # CI Summary
  # ===========================================================================
  ci-summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, docker-build]
    if: always()
    steps:
      - name: Generate CI summary
        run: |
          echo "## CI Pipeline Summary - Netflix LLM Platform" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Check overall result
        if: |
          needs.lint.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.security-scan.result == 'failure' ||
          needs.docker-build.result == 'failure'
        run: |
          echo "::error::One or more CI jobs failed"
          exit 1
