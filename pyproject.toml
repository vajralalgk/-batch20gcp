# ============================================================================
# Netflix Real-Time LLM Personalization & Inference Platform
# Author: Gopi Krishna Vajrala
# ============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix-llm-platform"
version = "1.0.0"
description = "Real-Time LLM Personalization & Inference Platform for Netflix-scale streaming"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Gopi Krishna Vajrala", email = "gopi.vajrala@example.com"},
]
keywords = [
    "llm", "inference", "gpu", "personalization", "triton",
    "tensorrt", "distributed-systems", "ml-infrastructure",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "gpu: marks tests requiring GPU hardware",
    "integration: marks integration tests",
    "performance: marks performance/load tests",
    "slow: marks slow-running tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101", "S104"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
