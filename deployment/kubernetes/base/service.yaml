# =============================================================================
# Netflix Real-Time LLM Personalization & Inference Platform
# Base Kustomize Service
# =============================================================================
# ClusterIP Service providing a stable network endpoint for the Netflix LLM
# API pods. Fronted by an Ingress or cloud load balancer for external access.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: netflix-llm-api
  namespace: netflix-llm
  labels:
    app.kubernetes.io/name: netflix-llm-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: netflix-llm-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    app.kubernetes.io/description: "Netflix LLM API Service"
    team: "netflix-ml-platform"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netflix-llm-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics
  sessionAffinity: None
