# =============================================================================
# Netflix Real-Time LLM Personalization & Inference Platform
# Kustomize Base Configuration
# =============================================================================
# Entry point for kustomize build. Defines common resources, labels, and
# configuration shared across all environments. Environment-specific overlays
# extend this base with patches for replicas, resources, image tags, and env.
#
# Usage:
#   Preview: kubectl kustomize deployment/kubernetes/base/
#   Apply:   kubectl apply -k deployment/kubernetes/base/
#   Overlay: kubectl apply -k deployment/kubernetes/overlays/prod/
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netflix-llm

# Common labels applied to all resources and their selectors.
commonLabels:
  app.kubernetes.io/name: netflix-llm-api
  app.kubernetes.io/part-of: netflix-llm-platform
  app.kubernetes.io/managed-by: kustomize

# Common annotations for all resources.
commonAnnotations:
  team: "netflix-ml-platform"
  contact: "ml-platform@netflix.com"
  project: "netflix-llm-platform"

# Resources included in this base.
resources:
  - deployment.yaml
  - service.yaml

# Image customization: overlays override newTag per environment.
images:
  - name: netflix-llm-api
    newName: netflix-llm-api
    newTag: latest

# ConfigMap generation for application settings.
configMapGenerator:
  - name: netflix-llm-api-config
    literals:
      - environment=production
      - workers=4
      - log-level=info
      - triton-grpc-url=triton-inference-server:8001
      - triton-http-url=triton-inference-server:8002
      - cors-origins=https://www.netflix.com,https://api.netflix.com

generatorOptions:
  disableNameSuffixHash: false
  labels:
    app.kubernetes.io/name: netflix-llm-api
  annotations:
    note: "Generated by Kustomize - do not edit directly"
