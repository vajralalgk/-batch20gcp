# =============================================================================
# Netflix Real-Time LLM Personalization & Inference Platform
# Base Kustomize Deployment
# =============================================================================
# Base deployment manifest for the Netflix LLM Platform. Defines the FastAPI
# inference gateway with GPU-aware configuration, health checks, resource
# limits, and security context. Environment-specific overlays extend this
# base with patches for replicas, resources, image tags, and environment
# variables.
#
# Apply: kubectl apply -k deployment/kubernetes/base/
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-llm-api
  namespace: netflix-llm
  labels:
    app.kubernetes.io/name: netflix-llm-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: netflix-llm-platform
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: "latest"
  annotations:
    app.kubernetes.io/description: "Netflix Real-Time LLM Personalization & Inference Platform"
    team: "netflix-ml-platform"
    contact: "ml-platform@netflix.com"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: netflix-llm-api
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netflix-llm-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: netflix-llm-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: netflix-llm-api-sa
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: netflix-llm-api

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - netflix-llm-api
                topologyKey: kubernetes.io/hostname

      containers:
        - name: netflix-llm-api
          image: netflix-llm-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: environment
            - name: PORT
              value: "8000"
            - name: WORKERS
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: workers
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: log-level
            - name: TRITON_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: triton-grpc-url
            - name: TRITON_HTTP_URL
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: triton-http-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: netflix-llm-api-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: netflix-llm-api-secrets
                  key: secret-key
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: cors-origins

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: log-volume
              mountPath: /app/logs
            - name: app-tmp-volume
              mountPath: /app/tmp

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: "100Mi"
        - name: log-volume
          emptyDir: {}
        - name: app-tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: "50Mi"
