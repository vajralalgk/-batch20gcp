# =============================================================================
# Netflix Real-Time LLM Platform - FastAPI Inference Gateway Deployment
# =============================================================================
# The API gateway handles client requests, applies real-time personalization,
# manages session memory, and routes inference calls to Triton.
# 3 replicas with anti-affinity for high availability.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-llm-api
  namespace: netflix-llm
  labels:
    app.kubernetes.io/name: netflix-llm-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: netflix-llm-platform
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/version: "latest"
  annotations:
    app.kubernetes.io/description: "Netflix LLM inference gateway (FastAPI)"
    team: "netflix-ml-platform"
    contact: "ml-platform@netflix.com"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: netflix-llm-api
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netflix-llm-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: netflix-llm-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: netflix-llm-api-sa
      terminationGracePeriodSeconds: 60

      # Pod-level security context: non-root with seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Anti-affinity: spread API pods across different nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - netflix-llm-api
                topologyKey: kubernetes.io/hostname
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - netflix-llm-api
              topologyKey: topology.kubernetes.io/zone

      # Spread across zones for balanced distribution.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: netflix-llm-api

      containers:
        - name: netflix-llm-api
          image: netflix-llm-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment variables from ConfigMap (non-sensitive settings).
          envFrom:
            - configMapRef:
                name: netflix-llm-api-config

          # Environment variables from Secrets (sensitive credentials).
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: environment
            - name: PORT
              value: "8000"
            - name: WORKERS
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: workers
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: log-level
            - name: TRITON_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: triton-grpc-url
            - name: TRITON_HTTP_URL
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: triton-http-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: netflix-llm-api-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: netflix-llm-api-secrets
                  key: secret-key
            - name: MODEL_REPOSITORY
              value: "/models"
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: netflix-llm-api-config
                  key: cors-origins

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # Liveness probe: restart if the API becomes unresponsive.
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Readiness probe: stop routing traffic while the API is initializing.
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Startup probe: allow up to 150 seconds for initial startup.
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: log-volume
              mountPath: /app/logs
            - name: app-tmp-volume
              mountPath: /app/tmp

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: "100Mi"
        - name: log-volume
          emptyDir: {}
        - name: app-tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: "50Mi"
