# =============================================================================
# Netflix Real-Time LLM Platform - API Service
# =============================================================================
# LoadBalancer Service exposing the FastAPI inference gateway to external
# clients. Routes traffic to all healthy API pods.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: netflix-llm-api
  namespace: netflix-llm
  labels:
    app.kubernetes.io/name: netflix-llm-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: netflix-llm-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    app.kubernetes.io/description: "Netflix LLM API Service - External inference endpoint"
    team: "netflix-ml-platform"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    # Cloud provider annotations for load balancer configuration
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: netflix-llm-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
  sessionAffinity: None
