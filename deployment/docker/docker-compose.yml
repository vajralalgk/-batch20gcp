# =============================================================================
# Netflix Real-Time LLM Personalization & Inference Platform - Docker Compose
# =============================================================================
# Full local stack: FastAPI gateway, NVIDIA Triton Inference Server, Redis,
# Prometheus, Grafana, and DCGM Exporter for GPU monitoring.
#
# Usage:
#   Start all services:     docker compose up -d
#   Stop all services:      docker compose down
#   View logs:              docker compose logs -f
#   Rebuild and start:      docker compose up -d --build
#   Remove volumes (reset): docker compose down -v
# =============================================================================

version: "3.9"

services:

  # =========================================================================
  # SERVICE: FastAPI Inference Gateway
  # =========================================================================
  # The main application service that handles inference requests, applies
  # real-time personalization, and routes to Triton Inference Server.
  # =========================================================================
  api:
    container_name: netflix-llm-api
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      args:
        BUILD_DATE: "local-dev"
        VCS_REF: "local"
        VERSION: "dev"
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - ../../src:/app/src:cached
      - app-logs:/app/logs
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - WORKERS=2
      - DEBUG=true
      - LOG_LEVEL=debug
      - TRITON_GRPC_URL=triton:8001
      - TRITON_HTTP_URL=triton:8002
      - REDIS_URL=redis://redis:6379/0
      - MODEL_REPOSITORY=/models
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - SECRET_KEY=dev-secret-key-do-not-use-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    depends_on:
      triton:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netflix-llm-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
      --log-level debug
      --access-log

  # =========================================================================
  # SERVICE: NVIDIA Triton Inference Server
  # =========================================================================
  # High-performance inference server supporting TensorRT-LLM, ONNX,
  # PyTorch, and TensorFlow models. Exposes gRPC (8001) and HTTP (8002)
  # endpoints for inference requests and a metrics endpoint (8003).
  # =========================================================================
  triton:
    container_name: netflix-triton
    image: nvcr.io/nvidia/tritonserver:24.01-trtllm-python-py3
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    volumes:
      - model-repository:/models
      - triton-cache:/opt/tritonserver/caches
    environment:
      - TRITON_SERVER_CPU_ONLY=0
      - CUDA_VISIBLE_DEVICES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4
    networks:
      - netflix-llm-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 32g
    shm_size: "2gb"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8002/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    command: >
      tritonserver
      --model-repository=/models
      --strict-model-config=false
      --log-verbose=1
      --allow-grpc=true
      --allow-http=true
      --allow-metrics=true
      --grpc-port=8001
      --http-port=8002
      --metrics-port=8003
      --response-cache-byte-size=1073741824
      --backend-config=python,shm-default-byte-size=1048576

  # =========================================================================
  # SERVICE: Redis (Session Memory & Feature Cache)
  # =========================================================================
  # In-memory data store for user session state, feature caching, real-time
  # personalization signals, and rate limiting. Configured with AOF
  # persistence and LRU eviction.
  # =========================================================================
  redis:
    container_name: netflix-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - netflix-llm-network
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =========================================================================
  # SERVICE: Prometheus (Metrics Collection)
  # =========================================================================
  # Collects metrics from the API, Triton, DCGM exporter, and node-exporter.
  # Scrape interval is 15 seconds. Alert rules are loaded from a mounted
  # configuration file.
  # =========================================================================
  prometheus:
    container_name: netflix-prometheus
    image: prom/prometheus:v2.48.1
    ports:
      - "9091:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    networks:
      - netflix-llm-network
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================================
  # SERVICE: Grafana (Dashboards & Visualization)
  # =========================================================================
  # Pre-configured with dashboards for GPU utilization, inference latency,
  # throughput, and model performance. Prometheus is auto-provisioned as
  # a data source.
  # =========================================================================
  grafana:
    container_name: netflix-grafana
    image: grafana/grafana:10.2.3
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=netflix-llm-admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - netflix-llm-network
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =========================================================================
  # SERVICE: NVIDIA DCGM Exporter (GPU Metrics)
  # =========================================================================
  # Exports detailed GPU metrics (utilization, temperature, memory, power,
  # clock speeds, ECC errors) in Prometheus format. Essential for GPU
  # autoscaling and capacity planning.
  # =========================================================================
  dcgm-exporter:
    container_name: netflix-dcgm-exporter
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.0-3.2.0-ubuntu22.04
    ports:
      - "9400:9400"
    networks:
      - netflix-llm-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false

# ===========================================================================
# NETWORKS
# ===========================================================================
networks:
  netflix-llm-network:
    driver: bridge
    name: netflix-llm-network
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ===========================================================================
# VOLUMES
# ===========================================================================
volumes:
  model-repository:
    driver: local
    name: netflix-model-repository
  triton-cache:
    driver: local
    name: netflix-triton-cache
  redis-data:
    driver: local
    name: netflix-redis-data
  prometheus-data:
    driver: local
    name: netflix-prometheus-data
  grafana-data:
    driver: local
    name: netflix-grafana-data
  app-logs:
    driver: local
    name: netflix-app-logs
